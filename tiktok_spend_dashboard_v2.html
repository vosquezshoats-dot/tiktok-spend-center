<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Spend Center</title>
<style>
:root{--purple:#6757d9;--purple2:#f0edff;--ink:#202235;--muted:#777b8e;--line:#ececf2;--bg:#f7f7fb;--green:#16865b}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
.app{display:flex;min-height:100vh}.sidebar{width:230px;background:#fff;border-right:1px solid var(--line);padding:26px 16px;flex-shrink:0}
.logo{font-size:18px;font-weight:750;letter-spacing:-.4px;padding:0 12px 30px}.logo span{color:var(--purple)}
.navlabel{font-size:11px;color:#a0a2af;font-weight:700;letter-spacing:1px;padding:0 12px 9px}.nav{display:flex;gap:11px;align-items:center;padding:11px 12px;border-radius:9px;color:#65697b;margin-bottom:5px}.nav.active{background:var(--purple2);color:var(--purple);font-weight:650}.nav .ico{width:18px;text-align:center}
.sidefoot{position:absolute;bottom:24px;color:#9a9cac;font-size:12px;padding:0 12px}
main{flex:1;min-width:0;padding:34px 42px 60px;max-width:1500px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.eyebrow{color:var(--muted);font-size:12px}.topright{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:20px}
h1{font-size:25px;margin:0 0 6px;letter-spacing:-.6px}h2{font-size:18px;margin:0}.sub{color:var(--muted);margin:0}
.toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;background:#fff;padding:16px;border:1px solid var(--line);border-radius:12px;margin:24px 0}
.field{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}.field input{border:1px solid #e3e4ec;border-radius:7px;padding:9px 10px;color:var(--ink);background:#fff}
button{border:0;border-radius:8px;background:var(--purple);color:#fff;padding:10px 16px;font-weight:650;cursor:pointer}button.secondary{background:#fff;color:#555a6d;border:1px solid var(--line)}button:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:12px;color:#85899a;margin:10px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:19px;box-shadow:0 2px 8px #25254a05;cursor:pointer;transition:.15s}
.card:hover{border-color:#c7c0ff;transform:translateY(-1px)}.cardhead{display:flex;justify-content:space-between;gap:10px;align-items:start}.bcname{font-size:16px;font-weight:700}.id{font-size:11px;color:#9699a8;margin-top:4px}.pill{font-size:11px;color:var(--green);background:#eaf7f1;border-radius:20px;padding:4px 8px;white-space:nowrap}
.metrics{display:flex;gap:20px;margin:20px 0 14px}.metric small{display:block;color:var(--muted);font-size:11px}.metric strong{font-size:21px;display:block;margin-top:3px}
.spends{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:7px}.currency{background:#f6f6fa;padding:5px 9px;border-radius:6px;font-size:12px}.currency b{margin-left:5px}
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line)}th{font-size:11px;color:var(--muted);font-weight:650;background:#fbfbfd}td{font-size:13px}tbody tr:last-child td{border-bottom:0}.link{color:var(--purple);font-weight:650;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:40px}
.back{color:var(--purple);cursor:pointer;font-size:13px;margin-bottom:18px;display:inline-block}.switch{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-left:auto}
.footer{margin-top:26px;color:#a0a2af;font-size:11px}
@media(max-width:760px){.sidebar{width:65px;padding:20px 8px}.logo{font-size:0;padding:0 8px 28px}.logo:after{content:"T";font-size:21px;color:var(--purple)}.nav{justify-content:center;padding:12px 5px;font-size:0}.nav .ico{font-size:17px}.navlabel,.sidefoot{display:none}main{padding:24px 16px}.top{align-items:flex-start}.topright{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">TikTok <span>Spend Center</span></div>
  <div class="navlabel">WORKSPACE</div>
  <div class="nav active"><span class="ico">▦</span> 消耗日报</div>
  <div class="nav"><span class="ico">◷</span> 历史记录</div>
  <div class="nav"><span class="ico">⇩</span> 导出中心</div>
  <div class="sidefoot">TikTok Marketing API<br>Spend Dashboard</div>
</aside>
<main>
  <div class="top"><div class="eyebrow">WORKSPACE / SPEND REPORT</div><div class="topright">● 本地演示模式</div></div>
  <section id="content"></section>
  <div class="footer">演示数据仅用于预览界面。当前版本尚未连接 TikTok Marketing API，不代表真实广告消耗。</div>
</main>
</div>
<script>
const demo=[
 {id:"7644817117799481345",name:"Global Growth Business Center",accounts:[
  {id:"701000001",name:"Brand US - Main",currency:"USD",daily:[["2026-11-01",125.40],["2026-11-02",98.20],["2026-11-03",146.80]]},
  {id:"701000002",name:"Brand UK - Ads",currency:"GBP",daily:[["2026-11-01",42.10],["2026-11-02",0],["2026-11-03",65.30]]},
  {id:"701000003",name:"Brand SG - Test",currency:"SGD",daily:[["2026-11-01",0],["2026-11-02",0],["2026-11-03",0]]}]},
 {id:"7644817117799481346",name:"North America Business Center",accounts:[
  {id:"702000001",name:"US Performance",currency:"USD",daily:[["2026-11-01",310.50],["2026-11-02",288.10],["2026-11-03",322.70]]},
  {id:"702000002",name:"Canada Campaigns",currency:"CAD",daily:[["2026-11-01",74.25],["2026-11-02",81.40],["2026-11-03",0]]}]},
 {id:"7644817117799481347",name:"Europe Business Center",accounts:[
  {id:"703000001",name:"Germany Ads",currency:"EUR",daily:[["2026-11-01",91.20],["2026-11-02",103.60],["2026-11-03",88.90]]}]},
 {id:"7644817117799481348",name:"Asia Pacific Business Center",accounts:[
  {id:"704000001",name:"Japan Store",currency:"JPY",daily:[["2026-11-01",12800],["2026-11-02",15400],["2026-11-03",13900]]},
  {id:"704000002",name:"Australia Store",currency:"AUD",daily:[["2026-11-01",0],["2026-11-02",55.20],["2026-11-03",62.80]]}]},
 {id:"7644817117799481349",name:"Test Business Center",accounts:[
  {id:"705000001",name:"Creative Test",currency:"USD",daily:[["2026-11-01",0],["2026-11-02",0],["2026-11-03",12.50]]}]}
];
let start="2026-11-01",end="2026-11-03",showZero=false,currentBC=null,currentAccount=null;
const money=(n)=>Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
function total(a){return a.daily.filter(x=>x[0]>=start&&x[0]<=end).reduce((s,x)=>s+x[1],0)}
function filteredAccounts(bc){return bc.accounts.filter(a=>showZero||total(a)>0)}
function aggregate(bc){let out={};bc.accounts.forEach(a=>{out[a.currency]=(out[a.currency]||0)+total(a)});return out}
function dateControls(){return `<div class="toolbar"><label class="field">开始日期 / Start date<input id="start" type="date" value="${start}"></label><label class="field">结束日期 / End date<input id="end" type="date" value="${end}"></label><button onclick="applyDates()">查询 / Apply</button></div>`}
function applyDates(){let s=document.getElementById("start").value,e=document.getElementById("end").value;if(!s||!e||s>e){alert("请检查日期范围 / Please check the date range.");return}start=s;end=e;render()}
function renderHome(){currentBC=null;currentAccount=null;let html=`<h1>消耗日报</h1><p class="sub">Business Center Spend Overview · 按 BC 独立统计，不合并币种</p>${dateControls()}<p class="note">以下为演示数据 · 点击任意 Business Center 查看广告账户</p><div class="grid">`;
demo.forEach(bc=>{let ac=bc.accounts.filter(a=>total(a)>0).length;let sums=aggregate(bc);html+=`<article class="card" onclick="openBC('${bc.id}')"><div class="cardhead"><div><div class="bcname">${bc.name}</div><div class="id">BC ID: ${bc.id}</div></div><span class="pill">${ac} 个有消耗账户</span></div><div class="metrics"><div class="metric"><small>广告账户总数</small><strong>${bc.accounts.length}</strong></div><div class="metric"><small>有消耗账户</small><strong>${ac}</strong></div></div><div class="spends">${Object.entries(sums).filter(x=>x[1]>0).map(([c,v])=>`<span class="currency">${c}<b>${money(v)}</b></span>`).join("")||'<span class="currency">暂无消耗</span>'}</div></article>`});html+="</div>";document.getElementById("content").innerHTML=html}
function openBC(id){currentBC=demo.find(x=>x.id===id);renderBC()}
function renderBC(){let bc=currentBC,accounts=filteredAccounts(bc);let html=`<span class="back" onclick="renderHome()">← 返回日报首页 / Back</span><h1>${bc.name}</h1><p class="sub">BC ID: ${bc.id} · 广告账户明细</p>${dateControls()}<div class="toolbar" style="margin-top:0"><label class="switch" style="margin-left:0"><input type="checkbox" ${showZero?"checked":""} onchange="showZero=this.checked;renderBC()"> 显示零消耗账户 / Show zero-spend accounts</label><span class="note" style="margin:0">${accounts.length} 个账户</span></div><div class="tablewrap"><table><thead><tr><th>广告账户名称</th><th>Advertiser ID</th><th>币种</th><th>Spend</th><th>明细</th></tr></thead><tbody>`;
accounts.forEach(a=>html+=`<tr><td>${a.name}</td><td>${a.id}</td><td>${a.currency}</td><td><b>${money(total(a))}</b></td><td><span class="link" onclick="openAccount('${a.id}')">查看每日消耗 →</span></td></tr>`);
if(!accounts.length)html+='<tr><td colspan="5" class="empty">当前日期范围内没有消耗账户</td></tr>';html+=`</tbody></table></div>`;document.getElementById("content").innerHTML=html}
function openAccount(id){currentAccount=currentBC.accounts.find(x=>x.id===id);renderAccount()}
function renderAccount(){let a=currentAccount;let rows=a.daily.filter(x=>x[0]>=start&&x[0]<=end);let html=`<span class="back" onclick="renderBC()">← 返回账户列表 / Back</span><h1>${a.name}</h1><p class="sub">Advertiser ID: ${a.id} · ${a.currency} · 每日消耗明细</p>${dateControls()}<div class="tablewrap"><table><thead><tr><th>日期 / Date</th><th>Spend (${a.currency})</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x[0]}</td><td><b>${money(x[1])}</b></td></tr>`).join("")||'<tr><td colspan="2" class="empty">所选日期范围没有数据</td></tr>'}</tbody></table></div><div style="margin-top:16px"><button onclick="exportCSV()">导出 CSV / Export</button></div>`;document.getElementById("content").innerHTML=html}
function render(){if(currentAccount)renderAccount();else if(currentBC)renderBC();else renderHome()}
function exportCSV(){let a=currentAccount,rows=[["Date","Advertiser ID","Account","Currency","Spend"],...a.daily.filter(x=>x[0]>=start&&x[0]<=end).map(x=>[x[0],a.id,a.name,a.currency,x[1]])];let csv="\uFEFF"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");let blob=new Blob([csv],{type:"text/csv;charset=utf-8;"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=`${a.id}_daily_spend.csv`;link.click();URL.revokeObjectURL(url)}
renderHome();
</script>
</body>
</html>
