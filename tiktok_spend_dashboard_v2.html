<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Spend Center</title>
<style>
:root{--purple:#6757d9;--purple2:#f0edff;--ink:#202235;--muted:#777b8e;--line:#ececf2;--bg:#f7f7fb;--green:#16865b}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
.app{display:flex;min-height:100vh}.sidebar{width:230px;background:#fff;border-right:1px solid var(--line);padding:26px 16px;flex-shrink:0}
.logo{font-size:18px;font-weight:750;letter-spacing:-.4px;padding:0 12px 30px}.logo span{color:var(--purple)}
.navlabel{font-size:11px;color:#a0a2af;font-weight:700;letter-spacing:1px;padding:0 12px 9px}.nav{display:flex;gap:11px;align-items:center;padding:11px 12px;border-radius:9px;color:#65697b;margin-bottom:5px}.nav.active{background:var(--purple2);color:var(--purple);font-weight:650}.nav .ico{width:18px;text-align:center}
.sidefoot{position:absolute;bottom:24px;color:#9a9cac;font-size:12px;padding:0 12px}
main{flex:1;min-width:0;padding:34px 42px 60px;max-width:1500px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.eyebrow{color:var(--muted);font-size:12px}.topright{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:20px}
h1{font-size:25px;margin:0 0 6px;letter-spacing:-.6px}h2{font-size:18px;margin:0}.sub{color:var(--muted);margin:0}
.toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;background:#fff;padding:16px;border:1px solid var(--line);border-radius:12px;margin:24px 0}
.field{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}.field input{border:1px solid #e3e4ec;border-radius:7px;padding:9px 10px;color:var(--ink);background:#fff}
button{border:0;border-radius:8px;background:var(--purple);color:#fff;padding:10px 16px;font-weight:650;cursor:pointer}button.secondary{background:#fff;color:#555a6d;border:1px solid var(--line)}button:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:12px;color:#85899a;margin:10px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:19px;box-shadow:0 2px 8px #25254a05;cursor:pointer;transition:.15s}
.card:hover{border-color:#c7c0ff;transform:translateY(-1px)}.cardhead{display:flex;justify-content:space-between;gap:10px;align-items:start}.bcname{font-size:16px;font-weight:700}.id{font-size:11px;color:#9699a8;margin-top:4px}.pill{font-size:11px;color:var(--green);background:#eaf7f1;border-radius:20px;padding:4px 8px;white-space:nowrap}
.metrics{display:flex;gap:20px;margin:20px 0 14px}.metric small{display:block;color:var(--muted);font-size:11px}.metric strong{font-size:21px;display:block;margin-top:3px}
.spends{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:7px}.currency{background:#f6f6fa;padding:5px 9px;border-radius:6px;font-size:12px}.currency b{margin-left:5px}
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line)}th{font-size:11px;color:var(--muted);font-weight:650;background:#fbfbfd}td{font-size:13px}tbody tr:last-child td{border-bottom:0}.link{color:var(--purple);font-weight:650;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:40px}
.back{color:var(--purple);cursor:pointer;font-size:13px;margin-bottom:18px;display:inline-block}.switch{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-left:auto}
.footer{margin-top:26px;color:#a0a2af;font-size:11px}
@media(max-width:760px){.sidebar{width:65px;padding:20px 8px}.logo{font-size:0;padding:0 8px 28px}.logo:after{content:"T";font-size:21px;color:var(--purple)}.nav{justify-content:center;padding:12px 5px;font-size:0}.nav .ico{font-size:17px}.navlabel,.sidefoot{display:none}main{padding:24px 16px}.top{align-items:flex-start}.topright{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">TikTok <span>Spend Center</span></div>
  <div class="navlabel">WORKSPACE</div>
  <div class="nav active"><span class="ico">▦</span> 消耗日报</div>
  <div class="nav"><span class="ico">◷</span> 历史记录</div>
  <div class="nav"><span class="ico">⇩</span> 导出中心</div>
  <div class="sidefoot">TikTok Marketing API<br>Spend Dashboard</div>
</aside>
<main>
  <div class="top"><div class="eyebrow">WORKSPACE / SPEND REPORT</div><div class="topright">● 本地演示模式</div></div>
  <section id="content"></section>
  <div class="footer">演示数据仅用于预览界面。当前版本尚未连接 TikTok Marketing API，不代表真实广告消耗。</div>
</main>
</div>
<script>
const API="/api/tiktok/";let start=new Date(Date.now()-7*86400000).toISOString().slice(0,10),end=new Date(Date.now()-86400000).toISOString().slice(0,10),bcs=[],currentBC=null,currentAccount=null,showZero=false,spendRows=[];
const $=s=>document.querySelector(s),money=n=>Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path,opts={}){let r=await fetch(path,{credentials:"same-origin",...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}}),t=await r.text(),d={};try{d=t?JSON.parse(t):{}}catch{d={error:t}}if(r.status===401&&path!=="/api/login"){login("登录已过期，请重新登录");throw Error("登录已过期")}if(!r.ok)throw Error(d.error||d.message||("请求失败 "+r.status));return d}
function login(msg=""){document.querySelector(".app").innerHTML='<main style="max-width:420px;margin:12vh auto;background:white;padding:28px;border-radius:14px"><h1>TikTok Spend Center</h1><p>请输入工作台密码</p><form id="lf"><input id="pw" type="password" required placeholder="工作台密码" style="padding:12px;width:100%;margin:12px 0"><button>登录</button></form><p id="lm" class="note">'+esc(msg)+'</p></main>';$("#lf").onsubmit=async e=>{e.preventDefault();try{await api("/api/login",{method:"POST",body:JSON.stringify({password:$("#pw").value})});await init()}catch(x){$("#lm").textContent=x.message}}}
function dates(){return '<div class="toolbar"><label class="field">开始日期<input id="ds" type="date" value="'+start+'"></label><label class="field">结束日期<input id="de" type="date" value="'+end+'"></label><button onclick="applyDates()">查询</button><button class="secondary" onclick="logout()">退出</button></div>'}
async function applyDates(){start=$("#ds").value;end=$("#de").value;if(!start||!end||start>end)return alert("日期范围不正确");await loadSpend();render()}
async function loadSpend(){const d=await api(API+"daily-spend?start_date="+start+"&end_date="+end);spendRows=d.data||[]}
async function init(){try{const d=await api(API+"business-centers");if(!d.success)throw Error(d.message||"读取 BC 失败");bcs=(d.data?.list||[]).map(x=>({id:String(x.bc_info?.bc_id||""),name:x.bc_info?.name||"未命名 BC",accounts:[]})).filter(x=>x.id);await loadSpend();for(const bc of bcs){const a=await api(API+"business-center-accounts?bc_id="+encodeURIComponent(bc.id));bc.accounts=(a.data?.list||[]).map(x=>({id:String(x.asset_id||x.advertiser_id||""),name:x.asset_name||x.name||"未命名账户",currency:x.currency||"",raw:x})).filter(x=>x.id);for(const ac of bc.accounts){const row=spendRows.find(x=>String(x.advertiser_id)===ac.id&&String(x.business_center_id)===bc.id);if(row?.currency)ac.currency=row.currency;ac.daily=spendRows.filter(x=>String(x.advertiser_id)===ac.id&&String(x.business_center_id)===bc.id).map(x=>[x.report_date,Number(x.spend||0)]);}}render()}catch(e){if(!document.querySelector(".app"))return;$("#content").innerHTML='<div class="status">'+esc(e.message)+'</div>'}}
function total(a){return(a.daily||[]).filter(x=>x[0]>=start&&x[0]<=end).reduce((s,x)=>s+x[1],0)}
function renderHome(){currentBC=null;currentAccount=null;let html='<h1>消耗日报</h1><p class="sub">Business Center Spend Overview · 真实 D1 消耗数据</p>'+dates()+'<div class="grid">';bcs.forEach(b=>{let sums={};b.accounts.forEach(a=>sums[a.currency||"币种待确认"]=(sums[a.currency||"币种待确认"]||0)+total(a));let count=b.accounts.filter(a=>total(a)>0).length;html+='<article class="card" onclick="openBC(\''+esc(b.id)+'\')"><div class="cardhead"><div><div class="bcname">'+esc(b.name)+'</div><div class="id">BC ID: '+esc(b.id)+'</div></div><span class="pill">'+count+' 个有消耗账户</span></div><div class="metrics"><div class="metric"><small>广告账户总数</small><strong>'+b.accounts.length+'</strong></div><div class="metric"><small>有消耗账户</small><strong>'+count+'</strong></div></div><div class="spends">'+Object.entries(sums).map(([c,v])=>'<span class="currency">'+esc(c)+'<b>'+money(v)+'</b></span>').join("")+'</div></article>'});html+='</div>';$("#content").innerHTML=html}
function openBC(id){currentBC=bcs.find(x=>x.id===id);renderBC()}
function renderBC(){let a=currentBC.accounts.filter(x=>showZero||total(x)>0);$("#content").innerHTML='<span class="back" onclick="renderHome()">← 返回日报首页</span><h1>'+esc(currentBC.name)+'</h1><p class="sub">BC ID: '+esc(currentBC.id)+'</p>'+dates()+'<div class="toolbar"><label class="switch"><input type="checkbox" '+(showZero?'checked':'')+' onchange="showZero=this.checked;renderBC()"> 显示零消耗账户</label></div><div class="tablewrap"><table><thead><tr><th>广告账户名称</th><th>Advertiser ID</th><th>币种</th><th>Spend</th><th>明细</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.id)+'</td><td>'+esc(x.currency)+'</td><td><b>'+money(total(x))+'</b></td><td><span class="link" onclick="openAccount(\''+esc(x.id)+'\')">查看每日消耗 →</span></td></tr>').join("")+'</tbody></table></div>'}
function openAccount(id){currentAccount=currentBC.accounts.find(x=>x.id===id);renderAccount()}
function renderAccount(){let a=currentAccount,rows=(a.daily||[]).filter(x=>x[0]>=start&&x[0]<=end);$("#content").innerHTML='<span class="back" onclick="renderBC()">← 返回账户列表</span><h1>'+esc(a.name)+'</h1><p class="sub">Advertiser ID: '+esc(a.id)+' · '+esc(a.currency)+'</p>'+dates()+'<div class="tablewrap"><table><thead><tr><th>日期</th><th>Spend ('+esc(a.currency)+')</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x[0])+'</td><td><b>'+money(x[1])+'</b></td></tr>').join("")+'</tbody></table></div>'}
function render(){if(currentAccount)renderAccount();else if(currentBC)renderBC();else renderHome()}
async function logout(){await api("/api/logout",{method:"POST"});login("已退出登录")}
login();
</script>
</body>
</html>
